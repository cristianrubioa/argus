services:
  argus-web:
    build:
      context: .
    command: ["uvicorn", "argus.web.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    environment:
      ARGUS_DB_PATH: /data/argus.db
      ARGUS_SESSION_SECRET: ${ARGUS_SESSION_SECRET:?}
      ARGUS_SESSION_HTTPS_ONLY: ${ARGUS_SESSION_HTTPS_ONLY:-}
      ARGUS_ADMIN_USERNAME: ${ARGUS_ADMIN_USERNAME:?}
      ARGUS_ADMIN_PASSWORD: ${ARGUS_ADMIN_PASSWORD:?}
      ARGUS_MQTT_HOST: ${ARGUS_MQTT_HOST:-}
      ARGUS_MQTT_PORT: ${ARGUS_MQTT_PORT:-1883}
      ARGUS_MQTT_TOPIC_PREFIX: ${ARGUS_MQTT_TOPIC_PREFIX:-argus}
    volumes:
      - ./src:/app/src
      - /var/lib/argus:/data
    ports:
      - "8420:8000"
