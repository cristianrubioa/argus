{% extends "base.html" %}
{% block title %}Argus — {{ t('register_title') }}{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center">
  <form method="post" action="/register" id="register-form" class="w-80 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-lg p-6 space-y-4">
    <div class="flex items-center gap-3 mb-2">
      <i class="fa-solid fa-eye text-2xl text-blue-500 dark:text-blue-400"></i>
      <span class="font-semibold tracking-wide" style="font-size: var(--app-name-size)">Argus</span>
    </div>
    <p class="text-sm text-gray-600 dark:text-gray-400">{{ t('register_intro') }}</p>
    {% if error %}
    <div class="text-sm text-red-700 bg-red-100 border border-red-300 dark:text-red-400 dark:bg-red-900/30 dark:border-red-800 rounded px-3 py-2">{{ t(error) }}</div>
    {% endif %}
    <div>
      <label class="block text-sm text-gray-700 dark:text-gray-300 mb-1">{{ t('login_username') }}</label>
      <input type="text" name="username" required autofocus
        class="w-full bg-white dark:bg-gray-950 border border-gray-300 dark:border-gray-700 rounded px-2 py-1.5 text-sm focus:outline-none focus:border-blue-400">
    </div>
    <div>
      <label class="block text-sm text-gray-700 dark:text-gray-300 mb-1">{{ t('login_password') }}</label>
      <input type="password" name="password" required
        class="w-full bg-white dark:bg-gray-950 border border-gray-300 dark:border-gray-700 rounded px-2 py-1.5 text-sm focus:outline-none focus:border-blue-400">
    </div>
    <div>
      <label class="block text-sm text-gray-700 dark:text-gray-300 mb-1">{{ t('register_confirm_password') }}</label>
      <input type="password" name="confirm_password" required
        class="w-full bg-white dark:bg-gray-950 border border-gray-300 dark:border-gray-700 rounded px-2 py-1.5 text-sm focus:outline-none focus:border-blue-400">
    </div>
    <button type="submit" id="register-form-button" disabled
      class="w-full bg-blue-700 hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed text-white text-sm font-medium rounded px-3 py-2 transition">
      {{ t('register_submit') }}
    </button>
  </form>
</div>
<script>
  (function () {
    const form = document.getElementById("register-form");
    const button = document.getElementById("register-form-button");
    if (!form || !button) return;
    function checkFilled() {
      const inputs = form.querySelectorAll("input[type=password]");
      button.disabled = Array.from(inputs).some(function (input) { return input.value.trim() === ""; });
    }
    form.addEventListener("input", checkFilled);
  })();
</script>
{% endblock %}
