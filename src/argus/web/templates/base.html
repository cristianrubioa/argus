<!DOCTYPE html>
<html lang="{{ language|default('en') }}" class="{{ 'dark' if theme == 'dark' else '' }}" data-font-size="{{ font_size|default('md') }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Argus{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Argus dashboard — monitor and manage USB device authorization on this host.{% endblock %}">
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <link rel="stylesheet" href="https://crubio.fyi/crubio-ui/app/tokens.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha384-/o6I2CkkWC//PSjvWC/eYN7l3xM3tJm8ZzVkCOfp//W05QcE3mlGskpoHB6XqI+B" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" integrity="sha384-RkASv+6KfBMW9eknReJIJ6b3UnjKOKC5bOUaNgIY778NFbQ8MtWq9Lr/khUgqtTt" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://unpkg.com/htmx.org@2.0.3" integrity="sha384-0895/pl2MU10Hqc6jd4RvrthNlDiE9U1tWmX7WRESftEDRosgxNsQG/Ze9YMRzHq" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js" integrity="sha384-5JqMv4L/Xa0hfvtF06qboNdhvuYXUku9ZrhZh3bSk8VXF0A/RuSLHpLsSV9Zqhl6" crossorigin="anonymous"></script>
  <style>
    html[data-font-size="lg"] { font-size: 112.5%; }
    /* Flatpickr dark theme override, scoped to <html class="dark"> — light mode uses flatpickr's own default look */
    .dark .flatpickr-calendar { background: #020a18; border-color: #0f2040; box-shadow: 0 4px 24px rgba(0,0,0,.6); }
    .dark .flatpickr-months .flatpickr-month,
    .dark .flatpickr-weekdays,
    .dark span.flatpickr-weekday,
    .dark .flatpickr-time { background: #020a18; }
    .dark .flatpickr-day { color: #e2e8f0; border-color: transparent; }
    .dark .flatpickr-day:hover, .dark .flatpickr-day:focus { background: #0f2040; border-color: #0f2040; }
    .dark .flatpickr-day.selected, .dark .flatpickr-day.selected:hover, .dark .flatpickr-day.inRange { background: #2563eb; border-color: #2563eb; color: #fff; }
    .dark .flatpickr-day.flatpickr-disabled, .dark .flatpickr-day.prevMonthDay, .dark .flatpickr-day.nextMonthDay { color: #4a5568; }
    .dark .flatpickr-time input, .dark .flatpickr-time .flatpickr-time-separator { color: #e2e8f0; }
    .dark .flatpickr-time input:hover, .dark .flatpickr-time input:focus { background: #0f2040; }
    .dark .numInputWrapper:hover { background: #0a1628; }
    .dark .flatpickr-current-month .flatpickr-monthDropdown-months { background: #020a18; color: #e2e8f0; }
    .dark .flatpickr-months .flatpickr-prev-month svg, .dark .flatpickr-months .flatpickr-next-month svg { fill: #93c5fd; }
    .dark .flatpickr-months .flatpickr-prev-month:hover svg, .dark .flatpickr-months .flatpickr-next-month:hover svg { fill: #fff; }

    /* Collapsible sidebar below 768px — off-canvas, toggled via body.sidebar-open */
    @media (max-width: 767px) {
      #sidebar {
        position: fixed;
        top: var(--header-h);
        bottom: 0;
        left: 0;
        z-index: 50;
        transform: translateX(-100%);
        transition: transform .2s ease;
      }
      body.sidebar-open #sidebar { transform: translateX(0); }
      #sidebar-backdrop {
        display: none;
        position: fixed;
        inset: var(--header-h) 0 0 0;
        z-index: 40;
        background: rgba(0, 0, 0, .5);
      }
      body.sidebar-open #sidebar-backdrop { display: block; }
      #brand-block { width: auto !important; }
      #enforce-review-overlay { left: 0 !important; }
    }
    @media (min-width: 768px) {
      #sidebar-toggle { display: none; }
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-200">
  {% block body %}{% endblock %}
</body>
</html>
